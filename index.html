<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Birds Gone Wild</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/game.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#182016" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Birds Gone Wild" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="vig"></div>
    <div id="cloudfx"></div>
    <div id="hud">0</div>
    <div id="life">
      <b>&#10084;&#65039;</b>
      <div class="seg"><i></i></div>
      <div class="seg"><i></i></div>
      <div class="seg"><i></i></div>
    </div>
    <div id="warn">!</div>
    <div id="warn2">!</div>
    <div id="wallet"></div>
    <div id="fx"></div>
    <div id="shop"></div>
    <div id="pause">
      <div class="panel">
        <h2>Paused</h2>
        <p>You get a 3-2-1 countdown when you resume.</p>
        <button id="resume">&#9654; Resume</button>
        <div class="pgrid">
          <button id="pshop">&#128722; Shop</button><button id="pset">&#9881;&#65039; Settings</button
          ><button id="snd" aria-label="Toggle sound"></button><button id="rbtn">&#8635; Restart</button>
        </div>
        <p class="ver" id="pver"></p>
      </div>
    </div>
    <div id="lvl"></div>
    <div id="set"></div>
    <div id="xp"></div>
    <div id="count"></div>
    <div id="banner"></div>
    <button id="pbtn" class="tb" aria-label="Pause">&#10074;&#10074;</button>
    <button id="cbtn" class="tb" aria-label="Camera view"></button>
    <div id="msg">
      <div id="card">
        <h1>Birds Gone Wild</h1>
        <p>You are the bird. Fly through the gaps.</p>
        <p><b>Tap</b>, click or press <b>Space</b> to flap.</p>
        <p id="best"></p>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <!-- Game code: loaded in this order, all files share one scope (see docs/ARCHITECTURE.md). -->
    <script src="js/core/config.js"></script>
    <script src="js/scene/renderer.js"></script>
    <script src="js/scene/textures.js"></script>
    <script src="js/scene/bird.js"></script>
    <script src="js/scene/sky.js"></script>
    <script src="js/scene/mountains.js"></script>
    <script src="js/scene/effects.js"></script>
    <script src="js/scene/scenery.js"></script>
    <script src="js/scene/road.js"></script>
    <script src="js/scene/neon.js"></script>
    <script src="js/scene/world.js"></script>
    <script src="js/game/butterflies.js"></script>
    <script src="js/game/hawks.js"></script>
    <script src="js/game/pipes.js"></script>
    <script src="js/game/state.js"></script>
    <script src="js/game/coins.js"></script>
    <script src="js/ui/hud.js"></script>
    <script src="js/audio/sound.js"></script>
    <script src="js/audio/music.js"></script>
    <script src="js/game/items.js"></script>
    <script src="js/ui/shop.js"></script>
    <script src="js/game/run.js"></script>
    <script src="js/game/progression.js"></script>
    <script src="js/game/levels.js"></script>
    <script src="js/ui/pause.js"></script>
    <script src="js/ui/settings.js"></script>
    <script src="js/ui/start.js"></script>
    <script src="js/game/controls.js"></script>
    <script src="js/game/loop.js"></script>
    <script src="js/main.js"></script>
    <script src="js/register-sw.js"></script>
  </body>
</html>
