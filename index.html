// LEVELS: 50 short levels (about 25-60 s). Pattern in every block of 10: dodge levels, a butterfly level (x5),
// a boss level (x0, the Hawk Chief). lvD() is the difficulty: 0 on level 1 .. about 0.95 on level 50, rising in
// waves (each block of 10 builds up to its boss, the level after a boss is a breather). Fairness caps: at most
// 3 hawks per group, groups keep a 3.2 gap, every hawk locks its path >= ~0.9 s before it reaches you.

// Small saw-tooth inside each block of 10 (building to the boss) and a breather right after each boss.

const setEl=document.getElementById('set'),vigEl=document.getElementById('vig');
let composer=null,bloomPass=null,setTab='gfx';
function initComposer(){
 if(!(THREE.EffectComposer&&THREE.RenderPass&&THREE.UnrealBloomPass&&THREE.CopyShader))return;
 try{
  let rt;
  try{if(THREE.WebGLMultisampleRenderTarget&&renderer.capabilities.isWebGL2)rt=new THREE.WebGLMultisampleRenderTarget(innerWidth,innerHeight,{format:THREE.RGBAFormat});}catch(e){rt=undefined;}
  composer=new THREE.EffectComposer(renderer,rt);
  composer.addPass(new THREE.RenderPass(scene,cam));
  bloomPass=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.5,.65,.93);
  composer.addPass(bloomPass);
 }catch(e){composer=null;}
}
function capFps(){if(S.fps==='auto')return Math.min(120,hz);if(S.fps==='0')return 999;return +S.fps||60;}
function applyRes(){
 const th={'720p':720,'1080p':1080,'1440p':1440,'2160p':2160}[S.res];
 let pxv=S.res==='auto'?Math.min(devicePixelRatio,2):Math.min(4,th/Math.max(300,innerHeight));
 pxv=Math.max(.5,pxv*adaptK);
 renderer.setPixelRatio(pxv);renderer.setSize(innerWidth,innerHeight);
 if(composer){try{composer.setPixelRatio(pxv);composer.setSize(innerWidth,innerHeight);}catch(e){}}
}
function applyShadows(){
 const on=S.shadows!=='off',sz={low:1024,high:2048,ultra:4096}[S.shadows]||2048;
 sun.castShadow=on;
 if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}
 sun.shadow.mapSize.set(sz,sz);
 if(renderer.shadowMap.enabled!==on){renderer.shadowMap.enabled=on;scene.traverse(o=>{if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{m.needsUpdate=true;});}});}
}
function applyAniso(){const mx=renderer.capabilities.getMaxAnisotropy();texList.forEach(t=>{t.anisotropy=Math.min(S.aniso,mx);t.needsUpdate=true;});}
function applyAll(){adaptK=1;applyRes();applyShadows();applyAniso();vigEl.style.display=S.vignette?'':'none';}
function applyOne(k){
 if(k==='res'){adaptK=1;applyRes();}
 else if(k==='fps'){nextFrame=0;}
 else if(k==='adaptive'){if(!S.adaptive){adaptK=1;applyRes();}}
 else if(k==='shadows')applyShadows();
 else if(k==='aniso')applyAniso();
 else if(k==='vignette')vigEl.style.display=S.vignette?'':'none';
}
const PRESETS={low:{res:'720p',shadows:'off',bloom:false,particles:'low',aniso:2},medium:{res:'1080p',shadows:'low',bloom:false,particles:'high',aniso:4},high:{res:'1440p',shadows:'high',bloom:true,particles:'high',aniso:8},ultra:{res:'2160p',shadows:'ultra',bloom:true,particles:'high',aniso:16}};
function presetMatch(){for(const n in PRESETS){const q=PRESETS[n];if(Object.keys(q).every(k=>S[k]===q[k]))return n;}return '';}

 gfx:[

function segHTML(r){
 const cur=r.k==='preset'?presetMatch():String(S[r.k]);

 return '<div class="seg">'+o.map(a=>'<button data-k="'+r.k+'" data-v="'+a[0]+'"'+(cur===a[0]?' class="on"':'')+'>'+a[1]+'</button>').join('')+'</div>';
}
function renderSettings(){
 const old=setEl.querySelector('.panel'),st=old?old.scrollTop:0;
 let h='<div class="panel"><h2>Settings</h2><div class="tabs"><button data-tab="gfx"'+(setTab==='gfx'?' class="on"':'')+'>Graphics</button><button data-tab="snd"'+(setTab==='snd'?' class="on"':'')+'>Sound</button></div><div class="rows">';
 ROWS[setTab].forEach(r=>{
  let lab=r.l;
  if(r.k==='fps')lab+=' <small>(display '+hz+' Hz)</small>';
  if(r.k==='bloom'&&!composer)lab+=' <small>(unavailable here)</small>';
  if(r.t==='range'){const v=Math.round(S[r.k]*r.sc);h+='<div class="row"><label>'+lab+' <span class="val">'+v+r.u+'</span></label><input type="range" data-k="'+r.k+'" min="'+r.min+'" max="'+r.max+'" value="'+v+'"></div>';}
  else h+='<div class="row"><label>'+lab+'</label>'+segHTML(r)+'</div>';
 });
 h+='</div><div class="sfoot"><button id="resetbest">Reset best score</button>';if(setTab==='snd')h+='<button id="settest">Test sound</button>';
 h+='<button id="setclose">Done</button></div></div>';

 if(e.target===setEl){closeSettings();return;}
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='setclose'){closeSettings();return;}
 if(b.id==='settest'){sfx.coin();return;}
 if(b.id==='resetbest'){if(b.dataset.sure){resetBest();delete b.dataset.sure;b.classList.remove('sure');b.textContent='Best score reset \u2713';sfx.buy();}
  else{b.dataset.sure='1';b.classList.add('sure');b.textContent='Tap again to reset';setTimeout(()=>{if(b.dataset.sure){delete b.dataset.sure;b.classList.remove('sure');b.textContent='Reset best score';}},3000);}return;}
 if(b.dataset.tab){setTab=b.dataset.tab;renderSettings();return;}
 if(b.dataset.k){
  const k=b.dataset.k,v=b.dataset.v;
  if(k==='preset'){Object.assign(S,PRESETS[v]);applyAll();}
  else{const row=ROWS.gfx.concat(ROWS.snd).find(r=>r.k===k);S[k]=row.t==='bool'?v==='true':row.t==='num'?+v:v;applyOne(k);}
  saveS();renderSettings();
 }
});
setEl.addEventListener('input',e=>{

 saveS();
});

// moving pipes + coin pickup
function updPipe(p){
  const fo=Math.min(1,Math.max(0,1-(p.z-2.8)/3.4));p.pm.p.opacity=p.pm.c.opacity=fo;p.holes[0].visible=p.holes[1].visible=fo>.99;p.g.visible=fo>.01;
  const amp=Math.min(1,Math.max(0,(score-2)/12))*3.2*p.k*MODES[mode-1].mv;
  let gy=p.base+Math.sin(gt*p.fq+p.ph)*amp;
  gy=Math.max(BOT+GAP/2+.6,Math.min(TOP-GAP/2-.6,gy));
  p.gy=gy;p.g.position.y=gy;
  p.coins.forEach(c=>{if(c.got)return;const m=c.m;const rng=fxOn('magnet')?14:perks.pull*3.5;if(rng>0){const pz=p.z+m.position.z;if(pz>-rng&&pz<3){const k=1-Math.exp(-7*dtg);m.position.y+=(y-gy-m.position.y)*k;m.position.z+=(-p.z-m.position.z)*k;}}const cz=p.z+m.position.z;if(Math.abs(cz)<1.6&&Math.abs(y-(gy+m.position.y))<1.9){c.got=true;m.visible=false;const v=1.5*MM()*(fxOn('double')?2:1)*(Math.random()<perks.lucky*.15?2:1);wallet+=v;run+=v;saveW();sfx.coin();popText('+$'+fm(v));gainXp(1);wEl.classList.remove('bump');void wEl.offsetWidth;wEl.classList.add('bump');burst(0,gy+m.position.y,cz,14,0xffd23f,5,.6);}});
}

}

// "Download App": uses the browser's own install box when it offers one (Android Chrome/Edge/Samsung/Brave,
// desktop Chrome/Edge); otherwise opens the picture guide (install.html). Hidden once the game is installed.
let installEvt=null;
function isInstalled(){try{return (typeof matchMedia==='function'&&matchMedia('(display-mode: standalone)').matches)||(typeof navigator!=='undefined'&&navigator.standalone===true);}catch(e){return false;}}
function hideDl(){const b=document.getElementById('dlbtn');if(b&&b.remove)b.remove();}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;});
addEventListener('appinstalled',()=>{installEvt=null;hideDl();popText('Installed! Find it on your home screen','#7fe7ff');});
function downloadApp(){
 if(installEvt){const ev=installEvt;installEvt=null;ev.prompt();if(ev.userChoice)ev.userChoice.then(r=>{if(r&&r.outcome==='accepted')hideDl();}).catch(()=>{});}
 else location.href='install.html';}
function introText(){return BR?'<p>Beat 50 levels: dodge hawks, catch butterflies and survive the bosses. Each hit costs a heart &#10084;&#65039; and losing them all ends the run.</p><p><b>Tap</b>, click or press <b>Space</b> to flap.</p>'
 :'<p>Dodge the hawks (watch for the red <b>!</b> warnings) and catch butterflies to fill your life bar. You earn coins the longer you survive.</p><p><b>Tap</b>, click or press <b>Space</b> to flap.</p>';}
function setGame(b){if(b===BR)return;BR=b;try{localStorage.setItem('flappygame',b?'boss':'inf')}catch(e){}loadProg();freshRun();try{best=+localStorage.getItem(bkey())||0}catch(e){}
 reset();setW();updXp();updLife();showCard('Birds Gone Wild',introText());}
function showCard(title,body){
  const T=title==='Birds Gone Wild';card.classList.toggle('cols',T);card.innerHTML=(T?'<div class="cl">':'')+(title==='Birds Gone Wild'?'<img class="logo" alt="Birds Gone Wild" src="'+LOGO+'">':'<h1>'+title+'</h1>')+body+(T&&BR?'<p class="lvlnow">Level <b>'+level+'</b> of '+LVL_MAX+' &middot; '+lvGoalTxt()+'</p>':'')+'<p id="best">Best: '+best+' &nbsp; Wallet: <b class="wv">$'+fm(wallet)+'</b></p>'+(title==='Birds Gone Wild'?'</div><div class="cr"><p>Bird color</p><div id="swatches">'+Object.keys(COLORS).map(k=>'<button class="sw'+(k===birdCol?' on':'')+'" data-col="'+k+'" aria-label="'+k+' bird" style="background:#'+COLORS[k][0].toString(16).padStart(6,'0')+'"></button>').join('')+'</div><div id="gmodes"><button class="gm'+(BR?'':' on')+'" data-g="inf">&#9854;&#65039; Infinite Run</button><button class="gm'+(BR?' on':'')+'" data-g="boss">&#128081; Boss Run</button></div><button id="startbtn">Start</button> <div class="cardrow">'+(isInstalled()?'':'<button id="dlbtn" class="ghost">&#128242; Download App</button>')+'<button id="setbtn" class="ghost">&#9881; Settings</button></div><p class="ver">'+VER_TXT+'</p></div>':'');
  const lg=card.querySelector('.logo');if(lg&&lg.addEventListener)lg.addEventListener('load',fitMenus);fitMenus();
}
let cdHop=false;
function countdown(hop){showBanner();paused=true;cdHop=hop;cdEnd=Math.max(last,performance.now())+3000;cdLast=-1;} // 3-2-1-GO, game frozen meanwhile (same clock as the frame loop)
function levelHearts(){if(mode===5&&BR){lifePts=Math.max(lifePts,(level<=3?3:START_HEARTS)*LIFE_SEG);updLife();}} // each level starts with at least 2 hearts (3 on levels 1-3)
function startGame(){if(state!=='ready'||cdEnd)return;freshRun();setW();updXp();ac();startMusic();msg.style.display='none';state='play';speed=SPEED;useItems();y=1;vy=0;levelHearts();countdown(true);}
function cdTick(now){ // runs the 3-2-1-GO countdown
 const left=Math.min(3,Math.ceil((cdEnd-now)/1000));if(left!==cdLast&&left>0){cdLast=left;cdShow(left);tone(520,520,.12,'square',.09);}
 if(now>=cdEnd){cdEnd=0;cdShow('GO!');tone(880,1320,.2,'square',.09);setTimeout(()=>{if(cntEl.textContent==='GO!')cntEl.textContent='';},600);
  if(!setOpen&&!shopOpen&&!lvlOpen)paused=false;if(cdHop){cdHop=false;vy=FLAP;sfx.flap();flapAt=performance.now();}}}
// Every menu must fit on screen without scrolling: shrink any open panel that is too big.
function fitEl(el){if(!el||!el.offsetHeight)return;el.style.maxHeight='none';el.style.overflow='hidden';
 const s=Math.min(1,(innerHeight-20)/el.offsetHeight,(innerWidth-16)/el.offsetWidth);el.style.transform=s<.999?'scale('+s.toFixed(3)+')':'';}
function fitMenus(){[card,pauseEl&&pauseEl.querySelector('.panel'),shopEl&&shopEl.querySelector('.panel'),lvlEl&&lvlEl.querySelector('.panel'),setEl&&setEl.querySelector('.panel')].forEach(fitEl);}
function flap(){
  if(hold){hold=false;paused=false;cntEl.textContent='';cntEl.style.fontSize='';ac();vy=FLAP;sfx.flap();flapAt=performance.now();return;}
  if(shopOpen||setOpen||paused)return;
  ac();startMusic();
  if(state==='ready')return; // the game only starts from the Start button (startGame)
  if(state==='play'){vy=FLAP;sfx.flap();flapAt=performance.now();burst(0,y-.2,.9,6,0xffffff,2.2,.5);}
  else if(state==='dead'&&time>0.5&&!offer){reset();state='ready';showCard('Birds Gone Wild','<p><b>Tap</b>, click or press <b>Space</b> to flap.</p>');}
}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)flap();}});
addEventListener('pointerdown',e=>{if(state==='ready'&&msg.style.display!=='none')return; // start screen: only the Start button (or Space) starts
 e.preventDefault();flap();});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();applyRes();fitMenus();});

function die(){
  if(state==='dead'||gt<ghost)return;
  if(fx.shield){fx.shield=false;ghost=gt+1.5;vy=FLAP*1.1;y=Math.max(BOT+.8,Math.min(CEIL-.3,y));shake=.5;sfx.shield();burst(0,y,0,26,0x7fd0ff,5,.8);updFx();return;}
  if(mode===5&&lifePts>=LIFE_SEG){lifePts-=LIFE_SEG;ghost=gt+1.5;vy=FLAP*1.1;y=Math.max(BOT+.8,Math.min(CEIL-.3,y));shake=.5;sfx.shield();burst(0,y,0,26,0xff7aa8,5,.8);popText(lifePts>=LIFE_SEG?'Ouch! '+Math.floor(lifePts/LIFE_SEG)+' heart'+(lifePts>=2*LIFE_SEG?'s':'')+' left':'Last heart!','#ff7aa8');updLife();return;}
  state='dead';time=0;speed=0;shake=0.6;sfx.crash();burst(0,y,0,44,COLORS[birdCol][0],7,1.2);
  if(score>best){best=score;try{localStorage.setItem(bkey(),best)}catch(e){}}
  if(wallet>=reviveCost()){offer=true;card.innerHTML='<h1>Crash!</h1><p>Score: <b>'+score+'</b> &nbsp; Level: <b>'+level+'</b></p><p>'+(BR?'Revive to keep going from here ('+lvProg+'/'+lvNeed()+'). Give up and you go back to level 1.':'Revive now to keep your score, level and upgrades. Give up and you start over from zero.')+'</p><button id="revbtn">&#10084;&#65039; Revive for $'+reviveCost()+'</button> <button id="giveup">Give up</button><p>Wallet: <b>$'+fm(wallet)+'</b></p>';msg.style.display='flex';}else gameOver();
}

let uiLast='',last=performance.now(),nextFrame=0,fpsAcc=0,fpsN=0,adaptK=1,hz=60,hzS=[],hzN=0,hzLast=0;
function loop(now){
  requestAnimationFrame(loop);
  if(hzN<90){if(hzLast)hzS.push(now-hzLast);hzLast=now;if(++hzN===90){hzS.sort((a,b)=>a-b);const rhz=1000/hzS[hzS.length>>1];hz=[30,60,75,90,100,120,144,165,240,360].reduce((a,b)=>Math.abs(b-rhz)<Math.abs(a-rhz)?b:a);}}
  const fmS=1000/capFps();if(hzN>=90&&now<nextFrame-Math.min(2,fmS*.25))return;nextFrame=Math.max(nextFrame+fmS,now-fmS);
  const raw=now-last;const dt=paused?0:Math.min(raw/1000,0.05);last=now;time+=dt;dtg=dt;if(raw<200){fpsAcc+=raw;if(++fpsN>=90){const avg=fpsAcc/fpsN;fpsAcc=0;fpsN=0;if(S.adaptive&&hzN>=90&&avg>1000/Math.min(capFps(),hz)*1.3&&adaptK>.5){adaptK=Math.max(.5,adaptK-.12);applyRes();}}}

  if(state==='ready'){y=1+Math.sin(now/300)*0.5;}
  if(cdEnd)cdTick(now);
