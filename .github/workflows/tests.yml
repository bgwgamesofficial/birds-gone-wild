# Runs the two game tests on every push and pull request.
# Results show as a green tick or red cross next to each commit on github.com.
name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node tests/check.js
      - name: Smoke test (4,000 simulated frames, modes 1-5)
        run: node tests/smoke.js
